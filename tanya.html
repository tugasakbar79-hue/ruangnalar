<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanya 'Aqli | Ruang Nalar</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           OVERRIDE / CHAT LAYOUT
        ========================= */

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }

        /* navbar override: tetap di atas */
        .navbar {
            flex-shrink: 0;
        }

        /* =========================
           HERO — minimal
        ========================= */

        .hero {
            text-align: center;
            padding: 16px 16px 4px;
            flex-shrink: 0;
        }

        .hero .eyebrow {
            font-size: 11px;
            color: #c89b3c;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .hero h1 {
            font-size: clamp(18px, 3.5vw, 30px);
            margin: 6px auto;
            line-height: 1.2;
        }

        .hero h1 span {
            color: #c89b3c;
        }

        .hero p {
            font-size: 13px;
            color: #687080;
            max-width: 600px;
            margin: 4px auto 0;
            line-height: 1.4;
        }

        /* =========================
           CHAT — isi utama
        ========================= */

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 16px;
            min-height: 0;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            flex: 1;
            overflow: hidden;
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            margin-bottom: 12px;
        }

        .msg-header {
            font-size: 11px;
            font-weight: 700;
            color: #8b6f47;
            margin-bottom: 2px;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            word-break: break-word;
        }

        .user-bubble {
            background: #c89b3c;
            color: #172033;
        }

        .user-bubble .msg-text {
            white-space: pre-wrap;
            font-weight: 500;
        }

        .ai-bubble {
            background: #f7f3ea;
            border: 1px solid #e5dfd2;
            color: #333;
        }

        .ai-bubble .ai-section {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #e8e2d6;
        }

        .ai-bubble .ai-section:last-child {
            margin-bottom: 0;
        }

        .ai-bubble .section-icon {
            font-size: 12px;
            font-weight: 800;
            color: #c89b3c;
            margin-bottom: 3px;
        }

        .ai-bubble .section-content {
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
        }

        .ai-bubble .msg-text {
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        /* =========================
           INPUT — sticky bawah
        ========================= */

        .input-area {
            flex-shrink: 0;
            background: white;
            border-radius: 14px 14px 0 0;
            border-top: 1px solid #e5e7eb;
            padding: 10px 14px;
            box-shadow: 0 -2px 12px rgba(23, 32, 51, 0.04);
        }

        #questionInput {
            width: 100%;
            min-height: 44px;
            resize: none;
            padding: 10px 12px;
            border: 1px solid #d8dde5;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.4;
        }

        #questionInput:focus {
            border-color: #c89b3c;
        }

        .input-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            align-items: center;
        }

        .send-button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            background: #c89b3c;
            color: #172033;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-button:hover {
            background: #b18632;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .new-chat-btn {
            background: none;
            border: 1px solid #d8dde5;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 12px;
            color: #687080;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .new-chat-btn:hover {
            background: #f0f0f0;
        }

        #statusBox {
            display: none;
            margin-top: 4px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #fff8e7;
            border: 1px solid #ead8a6;
            color: #66501c;
            font-size: 12px;
        }

        #errorBox {
            display: none;
            margin-top: 4px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 12px;
        }

        /* =========================
           FOOTER — minimal
        ========================= */

        footer {
            flex-shrink: 0;
            padding: 8px 16px;
            text-align: center;
            background: #172033;
            color: white;
            font-size: 11px;
        }

        footer .footer-logo {
            font-size: 18px;
            font-weight: 800;
        }

        footer .footer-logo span {
            color: #c89b3c;
        }
</head>

<script>
    const menuToggle = document.getElementById("menuToggle");
    const navMenu = document.getElementById("navMenu");

    menuToggle.addEventListener("click", () => {
        navMenu.classList.toggle("show");
    });
</script>


<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">
        <div class="logo">Ruang<span>Nalar</span></div>

        <button class="menu-toggle" id="menuToggle">☰</button>

        <nav id="navMenu">
            <a href="index.html">Beranda</a>
            <a href="tanya.html" class="active">Tanya 'Aqli</a>
            <a href="admin.html">Chat Admin</a>
        </nav>
    </header>


    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <div class="eyebrow">
            TANYA 'AQLI
        </div>

        <h1>
            Apa yang sedang
            <span>kamu pikirkan?</span>
        </h1>

        <p>
            Tulis apa yang ingin kamu ketahui atau renungkan.
            <b>'Aqli</b> — Ruang Nalar AI — akan menjawabnya
            dengan pendekatan nalar dan perspektif Islam
            yang mencerahkan.
        </p>

    </section>


    <!-- =========================
         CHAT
    ========================= -->

    <section class="chat-section">

        <div class="chat-container">

            <!-- PESAN -->
            <div id="chatMessages">
                <!-- Chat bubbles muncul di sini -->
            </div>

            <!-- INPUT -->
            <div class="input-area">

                <textarea
                    id="questionInput"
                    placeholder="Tanya 'Aqli..."
                    rows="2"
                ></textarea>

                <div class="input-row">
                    <button
                        id="sendButton"
                        class="send-button"
                        type="button"
                    >
                        Kirim
                    </button>

                    <button
                        id="newChatBtn"
                        class="new-chat-btn"
                        type="button"
                    >
                        + Obrolan Baru
                    </button>
                </div>

                <!-- STATUS -->
                <div id="statusBox">
                    ⏳ 'Aqli sedang memikirkan jawaban...
                </div>

                <!-- ERROR -->
                <div id="errorBox"></div>

            </div>

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="footer-logo">
            Ruang<span>Nalar</span>
        </div>

        <p>
            Nalar Manusia dalam Islam
        </p>

        <small>
            © 2026 Ruang Nalar
        </small>

    </footer>


    <!-- =========================
         SCRIPT
    ========================= -->

    <script>

        // ==========================================
        // KONFIGURASI
        // ==========================================

        const API_URL = "https://discharge-temperature-asked-merge.trycloudflare.com";

        // ==========================================
        // STATE
        // ==========================================

        let conversationId = "";
        let isAsking = false;

        // ==========================================
        // ELEMENT
        // ==========================================

        const input = document.getElementById("questionInput");
        const sendButton = document.getElementById("sendButton");
        const newChatBtn = document.getElementById("newChatBtn");
        const statusBox = document.getElementById("statusBox");
        const errorBox = document.getElementById("errorBox");
        const chatMessages = document.getElementById("chatMessages");


        // ==========================================
        // UTILITY
        // ==========================================

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = "block";
        }

        function hideError() {
            errorBox.textContent = "";
            errorBox.style.display = "none";
        }

        function scrollToBottom() {
            // scroll the page to show newest message
            setTimeout(function () {
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: "smooth"
                });
            }, 50);
        }


        // ==========================================
        // RENDER PESAN
        // ==========================================

        function renderSections(answer) {
            const a = answer;
            const reasonMatch = a.match(/🧠\s*\*{0,2}PENJELASAN\*{0,2}\s*:?\s*([\s\S]*?)(?=☪️|$)/);
            const islamMatch = a.match(/☪️\s*\*{0,2}DALAM ISLAM\*{0,2}\s*:?\s*([\s\S]*?)(?=💭|📜|$)/);
            const reflectMatch = a.match(/💭\s*\*{0,2}REFLEKSI\*{0,2}\s*:?\s*([\s\S]*?)(?=📜|$)/);
            const dalilMatch = a.match(/📜\s*\*{0,2}DALIL\*{0,2}\s*:?\s*([\s\S]*?)$/);

            const hasReason = reasonMatch && reasonMatch[1].trim();
            const hasIslam = islamMatch && islamMatch[1].trim();
            const hasDalil = dalilMatch && dalilMatch[1].trim();
            const hasReflect = reflectMatch && reflectMatch[1].trim();

            let html = "";

            if (hasReason || hasIslam || hasDalil || hasReflect) {
                if (hasReason) {
                    html += '<div class="ai-section">' +
                        '<div class="section-icon">🧠 PENJELASAN</div>' +
                        '<div class="section-content">' + escapeHtml(reasonMatch[1].trim()) + '</div></div>';
                }
                if (hasIslam) {
                    html += '<div class="ai-section">' +
                        '<div class="section-icon">☪️ DALAM ISLAM</div>' +
                        '<div class="section-content">' + escapeHtml(islamMatch[1].trim()) + '</div></div>';
                }
                if (hasDalil) {
                    html += '<div class="ai-section">' +
                        '<div class="section-icon">📜 DALIL</div>' +
                        '<div class="section-content">' + escapeHtml(dalilMatch[1].trim()) + '</div></div>';
                }
                if (hasReflect) {
                    html += '<div class="ai-section">' +
                        '<div class="section-icon">💭 REFLEKSI</div>' +
                        '<div class="section-content">' + escapeHtml(reflectMatch[1].trim()) + '</div></div>';
                }
            } else {
                html = '<div class="msg-text">' + escapeHtml(answer) + '</div>';
            }

            return html;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\n/g, "<br>");
        }

        function appendMessage(role, text, answerRaw) {
            const div = document.createElement("div");
            div.className = "msg";

            let header = role === "user" ? "Kamu" : "'Aqli";
            let bubbleClass = role === "user" ? "user-bubble" : "ai-bubble";

            let contentHtml = "";

            if (role === "user") {
                contentHtml = '<div class="msg-text">' + escapeHtml(text) + '</div>';
            } else {
                // AI — render sections or fallback
                if (answerRaw) {
                    contentHtml = renderSections(answerRaw);
                } else {
                    contentHtml = '<div class="msg-text">' + escapeHtml(text) + '</div>';
                }
            }

            div.innerHTML =
                '<div class="msg-header">' + header + '</div>' +
                '<div class="msg-bubble ' + bubbleClass + '">' +
                contentHtml +
                '</div>';

            chatMessages.appendChild(div);
            scrollToBottom();
        }


        // ==========================================
        // KIRIM PERTANYAAN
        // ==========================================

        async function sendQuestion() {

            const question = input.value.trim();

            if (question === "") {
                alert("Tulis pertanyaan dulu.");
                input.focus();
                return;
            }

            if (isAsking) return;

            hideError();
            isAsking = true;

            // Disable input
            sendButton.disabled = true;
            sendButton.textContent = "⋯";
            statusBox.style.display = "block";

            // Tampilkan pertanyaan user
            appendMessage("user", question);

            // Kosongkan input
            input.value = "";

            try {

                const response = await fetch(
                    API_URL + "/api/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        question: question,
                        conversation_id: conversationId
                    })
                }
                );

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                const data = await response.json();

                // Simpan conversationId untuk follow-up
                if (data.conversation_id) {
                    conversationId = data.conversation_id;
                }

                // Tampilkan jawaban AI
                const answerText = data.answer || "(tidak ada jawaban)";
                appendMessage("ai", answerText, answerText);

            } catch (error) {

                console.error("API Error:", error);
                showError("Gagal: " + error.message);

            } finally {

                isAsking = false;
                sendButton.disabled = false;
                sendButton.textContent = "Kirim";
                statusBox.style.display = "none";

            }

        }


        // ==========================================
        // OBROLAN BARU
        // ==========================================

        function newChat() {
            conversationId = "";
            chatMessages.innerHTML = "";
            hideError();
            statusBox.style.display = "none";
            input.value = "";
            input.focus();

            // Tambah pesan sambutan
            const div = document.createElement("div");
            div.className = "msg";
            div.innerHTML =
                '<div class="msg-header">\'Aqli</div>' +
                '<div class="msg-bubble ai-bubble">' +
                '<div class="msg-text">Halo! Ada yang ingin kamu tanyakan? Ayo, tulis pertanyaanmu.</div>' +
                '</div>';
            chatMessages.appendChild(div);
        }


        // ==========================================
        // EVENT
        // ==========================================

        sendButton.addEventListener("click", sendQuestion);

        newChatBtn.addEventListener("click", newChat);

        input.addEventListener("keydown", function (event) {
            if (event.ctrlKey && event.key === "Enter") {
                event.preventDefault();
                sendQuestion();
            }
        });


        // ==========================================
        // INIT — sambutan pertama
        // ==========================================

        newChat();

    </script>

</body>

</html>
